services:
  app:
    # REPLACE 'image' with 'build'
    build: . 
    container_name: dev_app
    ports:
      - "3000:3000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=development
      # No longer need CHOKIDAR_USEPOLLING!

    # THE NEW WATCH CONFIGURATION
    develop:
      watch:
        # 1. Action: Sync
        # If any file changes in '.', copy it to '/app' in the container immediately.
        # This triggers your framework's HMR (Hot Module Replacement) automatically.
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/

        # 2. Action: Rebuild
        # If package.json changes, we can't just copy it. We need to reinstall deps.
        # This action tells Docker to rebuild the image and restart the container.
        - action: rebuild
          path: package.json

    depends_on:
      - redis
    networks:
      - dev_network

  redis:
    image: redis/redis-stack-server:latest
    container_name: dev_redis
    ports:
      - "6379:6379"
      - "8001:8001"
    networks:
      - dev_network

networks:
  dev_network:
    driver: bridge